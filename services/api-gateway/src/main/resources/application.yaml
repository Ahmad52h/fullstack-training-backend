spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: category-service
            uri: ${CATEGORY_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/categories/**

          - id: product-service
            uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/products/**

          - id: order-service
            uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/orders/**

server:
  port: 8080